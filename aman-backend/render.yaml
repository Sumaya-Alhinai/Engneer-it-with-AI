services:
  - type: web
    name: aman-ai-backend
    runtime: docker
    plan: starter
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aman-ai-db
          property: connectionString
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: N8N_CALLBACK_SECRET
        sync: false
      # ⚠️ لا قيمة افتراضية عمدًا: كان "*" ينشر الباك-إند مفتوحًا لأي موقع.
      # اضبطيه بلوحة Render بنطاقات الداشبورد والتطبيق فقط، مثل:
      #   https://aman-dashboard.vercel.app,https://amanai.app
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
    disk:
      name: aman-ai-uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: aman-ai-db
    plan: starter
    databaseName: AmanAI
    user: aman
