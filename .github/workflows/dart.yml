name: Flutter checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project source
        # The existing app has informational deprecation lints; keep real
        # warnings/errors blocking while those infos are cleaned up separately.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
